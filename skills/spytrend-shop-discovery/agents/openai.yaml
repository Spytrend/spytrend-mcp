interface:
  display_name: "SpyTrend Shop Discovery"
  short_description: "Find growing stores by traffic, growth and ad activity"
  default_prompt: "Use $spytrend-shop-discovery to find fast-growing beauty stores in the US that are scaling their ads."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising analytics MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: true
