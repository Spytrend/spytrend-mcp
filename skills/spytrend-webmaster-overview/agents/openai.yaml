interface:
  display_name: "SpyTrend Ad Network Overview"
  short_description: "Who is behind these ads: domains, pages, geos, reused creatives"
  default_prompt: "Use $spytrend-webmaster-overview to profile the advertising network behind example.com."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising analytics MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: true
