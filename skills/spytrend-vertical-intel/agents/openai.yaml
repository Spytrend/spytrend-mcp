interface:
  display_name: "SpyTrend Vertical Intelligence"
  short_description: "Map an ad vertical: top advertisers, networks, winning creatives"
  default_prompt: "Use $spytrend-vertical-intel to map the nutra vertical in Brazil: top advertisers, networks and most reused creatives."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising analytics MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: true
