interface:
  display_name: "SpyTrend Advertiser Overview"
  short_description: "Profile ranked advertisers and their winners"
  default_prompt: "Use $spytrend-advertiser-overview to profile ecommerce advertisers in the United States."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising intelligence MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: false
