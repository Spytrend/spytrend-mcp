interface:
  display_name: "SpyTrend Website Review"
  short_description: "One domain: traffic, ad footprint, advertisers, top creatives"
  default_prompt: "Use $spytrend-website-review to check example.com: traffic, whether it runs ads and who sends paid traffic to it."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising analytics MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: true
