interface:
  display_name: "SpyTrend Website Review"
  short_description: "Review one site's advertising footprint"
  default_prompt: "Use $spytrend-website-review to review the advertising footprint of example.com."
dependencies:
  tools:
    - type: "mcp"
      value: "spytrend"
      description: "SpyTrend advertising intelligence MCP server"
      transport: "streamable_http"
      url: "https://mcp.spytrend.com/mcp"
policy:
  allow_implicit_invocation: false
